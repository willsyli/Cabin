version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8080:8080"]
    environment:
      - PYTHONUNBUFFERED=1
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      - NEXT_PUBLIC_AEO_API=http://localhost:8080/metrics
    ports: ["3000:3000"]
